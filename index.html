<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sprite Sheet Cutter</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #0f1419 0%, #1a1f2e 100%);
      color: #e4e4e7;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 2.5rem;
      background: linear-gradient(135deg, #4ade80 0%, #22d3ee 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #9ca3af;
      font-size: 1rem;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 25px;
    }

    @media (max-width: 1024px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: rgba(26, 32, 41, 0.8);
      border: 1px solid rgba(42, 52, 65, 0.5);
      border-radius: 12px;
      padding: 25px;
      backdrop-filter: blur(10px);
    }

    .panel h2 {
      color: #4ade80;
      font-size: 1.2rem;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid rgba(74, 222, 128, 0.2);
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      color: #9ca3af;
      font-size: 0.9rem;
      margin-bottom: 6px;
      font-weight: 500;
    }

    input[type="number"],
    input[type="file"] {
      width: 100%;
      padding: 10px 12px;
      background: rgba(15, 20, 25, 0.6);
      border: 1px solid rgba(42, 52, 65, 0.8);
      border-radius: 8px;
      color: #e4e4e7;
      font-size: 0.95rem;
      transition: all 0.2s;
    }

    input[type="number"]:focus,
    input[type="file"]:focus {
      outline: none;
      border-color: #4ade80;
      background: rgba(15, 20, 25, 0.8);
    }

    input[type="file"] {
      cursor: pointer;
    }

    .input-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
      color: #0f1419;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(74, 222, 128, 0.3);
    }

    .btn-secondary {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: white;
    }

    .btn-secondary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
    }

    button:disabled {
      background: #374151;
      color: #6b7280;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .preview-section {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .info-box {
      padding: 12px 16px;
      background: rgba(74, 222, 128, 0.1);
      border-left: 3px solid #4ade80;
      border-radius: 6px;
      font-size: 0.9rem;
      color: #d1d5db;
    }

    .info-box.error {
      background: rgba(239, 68, 68, 0.1);
      border-left-color: #ef4444;
    }

    .info-box.success {
      background: rgba(74, 222, 128, 0.15);
      border-left-color: #4ade80;
    }

    .canvas-container {
      background: rgba(15, 20, 25, 0.6);
      border: 1px solid rgba(42, 52, 65, 0.5);
      border-radius: 8px;
      padding: 15px;
      overflow: auto;
      max-height: 500px;
    }

    canvas {
      display: block;
      max-width: 100%;
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
    }

    .sprites-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 12px;
      max-height: 400px;
      overflow-y: auto;
      padding: 15px;
      background: rgba(15, 20, 25, 0.4);
      border-radius: 8px;
    }

    .sprite-item {
      background: rgba(26, 32, 41, 0.6);
      border: 1px solid rgba(42, 52, 65, 0.5);
      border-radius: 6px;
      padding: 8px;
      text-align: center;
      transition: all 0.2s;
    }

    .sprite-item:hover {
      border-color: #4ade80;
      transform: scale(1.05);
    }

    .sprite-item img {
      max-width: 100%;
      max-height: 80px;
      image-rendering: pixelated;
      margin-bottom: 6px;
      background: repeating-conic-gradient(#808080 0% 25%, transparent 0% 50%) 50% / 10px 10px;
    }

    .sprite-item span {
      display: block;
      font-size: 0.75rem;
      color: #9ca3af;
      font-weight: 500;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #6b7280;
    }

    .empty-state svg {
      width: 64px;
      height: 64px;
      margin-bottom: 15px;
      opacity: 0.5;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(15, 20, 25, 0.4);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(74, 222, 128, 0.3);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(74, 222, 128, 0.5);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎮 Sprite Sheet Cutter</h1>
      <p class="subtitle">Corta y descarga sprites de tu sprite sheet</p>
    </header>

    <div class="main-grid">
      <!-- Panel de configuración -->
      <div class="panel">
        <h2>⚙️ Configuración</h2>
        
        <div class="form-group">
          <label for="fileInput">Sprite Sheet</label>
          <input type="file" id="fileInput" accept="image/*">
        </div>

        <div class="form-group">
          <label for="totalFrame">Total de Frames</label>
          <input type="number" id="totalFrame" value="1" min="1">
        </div>

        <div class="input-row">
          <div class="form-group">
            <label for="columns">Columnas</label>
            <input type="number" id="columns" value="1" min="1">
          </div>
          <div class="form-group">
            <label for="rows">Filas</label>
            <input type="number" id="rows" value="1" min="1">
          </div>
        </div>

        <div class="input-row">
          <div class="form-group">
            <label for="width">Ancho (px)</label>
            <input type="number" id="width" value="32" min="1">
          </div>
          <div class="form-group">
            <label for="height">Alto (px)</label>
            <input type="number" id="height" value="32" min="1">
          </div>
        </div>

        <div class="input-row">
          <div class="form-group">
            <label for="offsetX">Offset X</label>
            <input type="number" id="offsetX" value="0" min="0">
          </div>
          <div class="form-group">
            <label for="offsetY">Offset Y</label>
            <input type="number" id="offsetY" value="0" min="0">
          </div>
        </div>

        <div class="input-row">
          <div class="form-group">
            <label for="spacingX">Spacing X</label>
            <input type="number" id="spacingX" value="0" min="0">
          </div>
          <div class="form-group">
            <label for="spacingY">Spacing Y</label>
            <input type="number" id="spacingY" value="0" min="0">
          </div>
        </div>

        <button id="processBtn" class="btn-primary" disabled>
          ✂️ Cortar Sprites
        </button>
        <button id="downloadBtn" class="btn-secondary" disabled>
          📦 Descargar ZIP
        </button>
      </div>

      <!-- Panel de previsualización -->
      <div class="panel preview-section">
        <h2>👁️ Previsualización</h2>
        
        <div id="infoBox" class="info-box">
          Carga una imagen para comenzar
        </div>

        <div class="canvas-container">
          <canvas id="previewCanvas"></canvas>
        </div>

        <h2>🖼️ Sprites Cortados</h2>
        <div id="spritesGrid" class="sprites-grid">
          <div class="empty-state">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
            </svg>
            <p>Los sprites aparecerán aquí después de cortarlos</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Elementos del DOM
    const fileInput = document.getElementById('fileInput');
    const processBtn = document.getElementById('processBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const previewCanvas = document.getElementById('previewCanvas');
    const ctx = previewCanvas.getContext('2d');
    const infoBox = document.getElementById('infoBox');
    const spritesGrid = document.getElementById('spritesGrid');

    // Estado de la aplicación
    let loadedImage = null;
    let spritesData = [];

    // IDs de todos los campos numéricos
    const fieldIds = ['totalFrame', 'columns', 'rows', 'width', 'height', 'offsetX', 'offsetY', 'spacingX', 'spacingY'];

    // Event listeners para actualizar previsualización en tiempo real
    fieldIds.forEach(id => {
      document.getElementById(id).addEventListener('input', updatePreview);
    });

    // Cargar imagen
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          loadedImage = img;
          spritesData = [];
          downloadBtn.disabled = true;
          spritesGrid.innerHTML = '<div class="empty-state"><p>Los sprites aparecerán aquí después de cortarlos</p></div>';
          processBtn.disabled = false;
          showInfo(`Imagen cargada: ${img.width} × ${img.height} px`, 'success');
          updatePreview();
        };
        img.onerror = () => {
          showInfo('Error al cargar la imagen', 'error');
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    // Obtener parámetros del formulario
    function getParams() {
      return {
        totalFrame: parseInt(document.getElementById('totalFrame').value) || 1,
        columns: parseInt(document.getElementById('columns').value) || 1,
        rows: parseInt(document.getElementById('rows').value) || 1,
        width: parseInt(document.getElementById('width').value) || 32,
        height: parseInt(document.getElementById('height').value) || 32,
        offsetX: parseInt(document.getElementById('offsetX').value) || 0,
        offsetY: parseInt(document.getElementById('offsetY').value) || 0,
        spacingX: parseInt(document.getElementById('spacingX').value) || 0,
        spacingY: parseInt(document.getElementById('spacingY').value) || 0,
      };
    }

    // Actualizar previsualización del canvas
    function updatePreview() {
      if (!loadedImage) return;

      const params = getParams();
      previewCanvas.width = loadedImage.width;
      previewCanvas.height = loadedImage.height;

      // Dibujar imagen original
      ctx.drawImage(loadedImage, 0, 0);

      // Dibujar rectángulos sobre los sprites
      ctx.strokeStyle = '#4ade80';
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 5]);

      let count = 0;
      for (let row = 0; row < params.rows && count < params.totalFrame; row++) {
        for (let col = 0; col < params.columns && count < params.totalFrame; col++) {
          const x = params.offsetX + col * (params.width + params.spacingX);
          const y = params.offsetY + row * (params.height + params.spacingY);
          ctx.strokeRect(x, y, params.width, params.height);
          count++;
        }
      }

      ctx.setLineDash([]);
      showInfo(`Imagen: ${loadedImage.width}×${loadedImage.height} | Frames detectados: ${count}`, 'info');
    }

    // Procesar y cortar sprites
    processBtn.addEventListener('click', async () => {
      if (!loadedImage) return;

      const params = getParams();
      spritesData = [];
      spritesGrid.innerHTML = '';

      showInfo('Cortando sprites...', 'info');
      processBtn.disabled = true;

      try {
        let count = 0;
        const promises = [];

        for (let row = 0; row < params.rows && count < params.totalFrame; row++) {
          for (let col = 0; col < params.columns && count < params.totalFrame; col++) {
            const x = params.offsetX + col * (params.width + params.spacingX);
            const y = params.offsetY + row * (params.height + params.spacingY);
            const index = count;

            // Crear canvas temporal para este sprite
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = params.width;
            tempCanvas.height = params.height;
            const tempCtx = tempCanvas.getContext('2d');

            // Dibujar porción de la imagen
            tempCtx.drawImage(
              loadedImage,
              x, y, params.width, params.height,
              0, 0, params.width, params.height
            );

            const dataUrl = tempCanvas.toDataURL('image/png');
            const filename = `sprite_${String(index).padStart(3, '0')}.png`;

            // Crear thumbnail en la UI
            const spriteItem = document.createElement('div');
            spriteItem.className = 'sprite-item';
            spriteItem.innerHTML = `
              <img src="${dataUrl}" alt="${filename}">
              <span>${index}</span>
            `;
            spritesGrid.appendChild(spriteItem);

            // Convertir a blob para el ZIP
            promises.push(
              canvasToBlob(tempCanvas).then(blob => {
                spritesData.push({
                  filename,
                  blob,
                  dataUrl
                });
              })
            );

            count++;
          }
        }

        // Esperar a que todos los blobs estén listos
        await Promise.all(promises);

        downloadBtn.disabled = false;
        processBtn.disabled = false;
        showInfo(`✅ ${count} sprites cortados correctamente`, 'success');

      } catch (error) {
        showInfo(`Error al cortar sprites: ${error.message}`, 'error');
        processBtn.disabled = false;
      }
    });

    // Descargar sprites como ZIP
    downloadBtn.addEventListener('click', async () => {
      if (spritesData.length === 0) {
        showInfo('No hay sprites para descargar', 'error');
        return;
      }

      downloadBtn.disabled = true;
      downloadBtn.textContent = 'Generando ZIP...';

      try {
        const zip = new JSZip();

        // Agregar todos los sprites al ZIP
        spritesData.forEach(sprite => {
          zip.file(sprite.filename, sprite.blob);
        });

        // Generar el archivo ZIP
        const zipBlob = await zip.generateAsync({ type: 'blob' });

        // Descargar el ZIP
        const url = URL.createObjectURL(zipBlob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'sprites.zip';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        // Limpiar URL
        setTimeout(() => URL.revokeObjectURL(url), 1000);

        showInfo(`✅ ZIP descargado con ${spritesData.length} sprites`, 'success');

      } catch (error) {
        showInfo(`Error al generar ZIP: ${error.message}`, 'error');
      } finally {
        downloadBtn.disabled = false;
        downloadBtn.textContent = '📦 Descargar ZIP';
      }
    });

    // Helper: convertir canvas a blob
    function canvasToBlob(canvas) {
      return new Promise((resolve, reject) => {
        canvas.toBlob(blob => {
          if (blob) {
            resolve(blob);
          } else {
            reject(new Error('No se pudo convertir el canvas a blob'));
          }
        }, 'image/png');
      });
    }

    // Mostrar mensaje de información
    function showInfo(message, type = 'info') {
      infoBox.textContent = message;
      infoBox.className = 'info-box';
      if (type === 'error') infoBox.classList.add('error');
      if (type === 'success') infoBox.classList.add('success');
    }
  </script>
</body>
</html>
