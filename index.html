<script>
const fileInput = document.getElementById('fileInput');
const processBtn = document.getElementById('processBtn');
const downloadBtn = document.getElementById('downloadBtn');
const previewCanvas = document.getElementById('previewCanvas');
const ctx = previewCanvas.getContext('2d');
const info = document.getElementById('info');
const spritesGrid = document.getElementById('spritesGrid');

let loadedImage = null;
let cutSprites = []; // Array ordenado de {name, dataUrl, blob}

const fields = ['totalFrame','columns','rows','width','height','offsetX','offsetY','spacingX','spacingY'];
fields.forEach(id => document.getElementById(id).addEventListener('input', updatePreview));

// Helper: convertir canvas a Blob usando Promise
function canvasToBlob(canvas, type = 'image/png') {
  return new Promise((resolve, reject) => {
    canvas.toBlob(blob => {
      if (blob) resolve(blob);
      else reject(new Error('No se pudo convertir el canvas a blob'));
    }, type);
  });
}

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      loadedImage = img;
      info.textContent = `Imagen cargada: ${img.width} x ${img.height} px`;
      processBtn.disabled = false;
      cutSprites = [];
      downloadBtn.disabled = true;
      spritesGrid.innerHTML = '';
      updatePreview();
    };
    img.onerror = () => {
      info.textContent = '❌ Error al cargar la imagen.';
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

function getParams() {
  return {
    totalFrame: parseInt(document.getElementById('totalFrame').value) || 1,
    columns: parseInt(document.getElementById('columns').value) || 1,
    rows: parseInt(document.getElementById('rows').value) || 1,
    width: parseInt(document.getElementById('width').value) || 32,
    height: parseInt(document.getElementById('height').value) || 32,
    offsetX: parseInt(document.getElementById('offsetX').value) || 0,
    offsetY: parseInt(document.getElementById('offsetY').value) || 0,
    spacingX: parseInt(document.getElementById('spacingX').value) || 0,
    spacingY: parseInt(document.getElementById('spacingY').value) || 0,
  };
}

function updatePreview() {
  if (!loadedImage) return;
  const p = getParams();
  previewCanvas.width = loadedImage.width;
  previewCanvas.height = loadedImage.height;
  ctx.drawImage(loadedImage, 0, 0);

  ctx.strokeStyle = '#4ade80';
  ctx.lineWidth = 1;
  let count = 0;
  for (let r = 0; r < p.rows && count < p.totalFrame; r++) {
    for (let c = 0; c < p.columns && count < p.totalFrame; c++) {
      const x = p.offsetX + c * (p.width + p.spacingX);
      const y = p.offsetY + r * (p.height + p.spacingY);
      ctx.strokeRect(x + 0.5, y + 0.5, p.width, p.height);
      count++;
    }
  }
  info.textContent = `Imagen: ${loadedImage.width}x${loadedImage.height} | Frames detectados: ${count}`;
}

processBtn.addEventListener('click', async () => {
  if (!loadedImage) return;
  const p = getParams();
  cutSprites = [];
  spritesGrid.innerHTML = '';
  info.textContent = '⏳ Cortando sprites...';

  const promises = [];
  let count = 0;

  for (let r = 0; r < p.rows && count < p.totalFrame; r++) {
    for (let c = 0; c < p.columns && count < p.totalFrame; c++) {
      const sx = p.offsetX + c * (p.width + p.spacingX);
      const sy = p.offsetY + r * (p.height + p.spacingY);
      const idx = count;

      const tmpCanvas = document.createElement('canvas');
      tmpCanvas.width = p.width;
      tmpCanvas.height = p.height;
      const tctx = tmpCanvas.getContext('2d');
      tctx.drawImage(loadedImage, sx, sy, p.width, p.height, 0, 0, p.width, p.height);

      const dataUrl = tmpCanvas.toDataURL('image/png');
      const name = `sprite_${String(idx).padStart(3,'0')}.png`;

      // Thumbnail inmediato en la UI
      const div = document.createElement('div');
      div.className = 'sprite-thumb';
      div.innerHTML = `<img src="${dataUrl}" alt="${name}"><span>${idx}</span>`;
      spritesGrid.appendChild(div);

      // Promesa que se resuelve con el blob
      promises.push(
        canvasToBlob(tmpCanvas).then(blob => {
          cutSprites[idx] = { name, dataUrl, blob };
        })
      );

      count++;
    }
  }

  try {
    await Promise.all(promises);
    downloadBtn.disabled = false;
    info.textContent = `✅ ${count} sprites cortados correctamente.`;
  } catch (err) {
    info.textContent = '❌ Error al cortar sprites: ' + err.message;
  }
});

downloadBtn.addEventListener('click', async () => {
  if (cutSprites.length === 0) {
    info.textContent = '⚠️ No hay sprites para descargar. Primero córtalos.';
    return;
  }

  downloadBtn.disabled = true;
  downloadBtn.textContent = '⏳ Generando ZIP...';

  try {
    const zip = new JSZip();
    // Filtrar por si hubiera algún hueco
    cutSprites.forEach(s => {
      if (s && s.blob) zip.file(s.name, s.blob);
    });

    const content = await zip.generateAsync({ type: 'blob' });
    const url = URL.createObjectURL(content);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'sprites.zip';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);

    info.textContent = `✅ ZIP descargado con ${cutSprites.length} sprites.`;
  } catch (err) {
    info.textContent = '❌ Error al generar el ZIP: ' + err.message;
  } finally {
    downloadBtn.disabled = false;
    downloadBtn.textContent = '📦 Descargar ZIP';
  }
});
</script>
