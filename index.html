<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sprite Sheet Cutter</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0f1419;
    color: #e6e6e6;
    min-height: 100vh;
    padding: 20px;
  }
  .container {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 20px;
  }
  h1 {
    grid-column: 1 / -1;
    color: #4ade80;
    margin-bottom: 10px;
    font-size: 1.8rem;
  }
  .panel {
    background: #1a2029;
    border: 1px solid #2a3441;
    border-radius: 10px;
    padding: 20px;
  }
  .panel h2 {
    color: #4ade80;
    margin-bottom: 15px;
    font-size: 1.1rem;
    border-bottom: 1px solid #2a3441;
    padding-bottom: 8px;
  }
  .field {
    margin-bottom: 12px;
  }
  .field label {
    display: block;
    font-size: 0.85rem;
    color: #9ca3af;
    margin-bottom: 4px;
  }
  .field input[type="number"],
  .field input[type="file"] {
    width: 100%;
    padding: 8px 10px;
    background: #0f1419;
    border: 1px solid #2a3441;
    border-radius: 6px;
    color: #e6e6e6;
    font-size: 0.95rem;
  }
  .field input:focus {
    outline: none;
    border-color: #4ade80;
  }
  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  button {
    width: 100%;
    padding: 12px;
    background: #4ade80;
    color: #0f1419;
    border: none;
    border-radius: 6px;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.2s;
  }
  button:hover:not(:disabled) { background: #22c55e; }
  button:disabled {
    background: #374151;
    color: #6b7280;
    cursor: not-allowed;
  }
  .preview-area {
    display: flex;
    flex-direction: column;
    gap: 15px;
  }
  .canvas-wrapper {
    background: #0f1419;
    border: 1px solid #2a3441;
    border-radius: 8px;
    padding: 10px;
    overflow: auto;
    max-height: 600px;
  }
  canvas {
    display: block;
    max-width: 100%;
    image-rendering: pixelated;
  }
  .info {
    font-size: 0.85rem;
    color: #9ca3af;
    padding: 8px;
    background: #0f1419;
    border-radius: 6px;
    border-left: 3px solid #4ade80;
  }
  .sprites-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
    gap: 8px;
    max-height: 300px;
    overflow-y: auto;
    padding: 8px;
    background: #0f1419;
    border-radius: 6px;
  }
  .sprite-thumb {
    background: #1a2029;
    border: 1px solid #2a3441;
    border-radius: 4px;
    padding: 4px;
    text-align: center;
    font-size: 0.7rem;
    color: #9ca3af;
  }
  .sprite-thumb img {
    max-width: 100%;
    max-height: 60px;
    image-rendering: pixelated;
    display: block;
    margin: 0 auto 4px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>🎮 Sprite Sheet Cutter</h1>

  <div class="panel">
    <h2>Configuración</h2>
    <div class="field">
      <label>Imagen Sprite Sheet</label>
      <input type="file" id="fileInput" accept="image/*">
    </div>
    <div class="field">
      <label>Total de frames</label>
      <input type="number" id="totalFrame" value="1" min="1">
    </div>
    <div class="row">
      <div class="field">
        <label>Columnas</label>
        <input type="number" id="columns" value="1" min="1">
      </div>
      <div class="field">
        <label>Filas</label>
        <input type="number" id="rows" value="1" min="1">
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>Ancho (px)</label>
        <input type="number" id="width" value="32" min="1">
      </div>
      <div class="field">
        <label>Alto (px)</label>
        <input type="number" id="height" value="32" min="1">
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>Offset X</label>
        <input type="number" id="offsetX" value="0" min="0">
      </div>
      <div class="field">
        <label>Offset Y</label>
        <input type="number" id="offsetY" value="0" min="0">
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>Spacing X</label>
        <input type="number" id="spacingX" value="0" min="0">
      </div>
      <div class="field">
        <label>Spacing Y</label>
        <input type="number" id="spacingY" value="0" min="0">
      </div>
    </div>

    <button id="processBtn" disabled>Cortar Sprites</button>
    <button id="downloadBtn" disabled>📦 Descargar ZIP</button>
  </div>

  <div class="panel preview-area">
    <h2>Previsualización</h2>
    <div class="info" id="info">Carga una imagen para empezar.</div>
    <div class="canvas-wrapper">
      <canvas id="previewCanvas"></canvas>
    </div>
    <h2>Sprites cortados</h2>
    <div class="sprites-grid" id="spritesGrid"></div>
  </div>
</div>

<script>
const fileInput = document.getElementById('fileInput');
const processBtn = document.getElementById('processBtn');
const downloadBtn = document.getElementById('downloadBtn');
const previewCanvas = document.getElementById('previewCanvas');
const ctx = previewCanvas.getContext('2d');
const info = document.getElementById('info');
const spritesGrid = document.getElementById('spritesGrid');

let loadedImage = null;
let cutSprites = []; // {name, dataUrl, blob}

const fields = ['totalFrame','columns','rows','width','height','offsetX','offsetY','spacingX','spacingY'];
fields.forEach(id => document.getElementById(id).addEventListener('input', updatePreview));

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      loadedImage = img;
      info.textContent = `Imagen cargada: ${img.width} x ${img.height} px`;
      processBtn.disabled = false;
      updatePreview();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

function getParams() {
  return {
    totalFrame: parseInt(document.getElementById('totalFrame').value) || 1,
    columns: parseInt(document.getElementById('columns').value) || 1,
    rows: parseInt(document.getElementById('rows').value) || 1,
    width: parseInt(document.getElementById('width').value) || 32,
    height: parseInt(document.getElementById('height').value) || 32,
    offsetX: parseInt(document.getElementById('offsetX').value) || 0,
    offsetY: parseInt(document.getElementById('offsetY').value) || 0,
    spacingX: parseInt(document.getElementById('spacingX').value) || 0,
    spacingY: parseInt(document.getElementById('spacingY').value) || 0,
  };
}

function updatePreview() {
  if (!loadedImage) return;
  const p = getParams();
  previewCanvas.width = loadedImage.width;
  previewCanvas.height = loadedImage.height;
  ctx.drawImage(loadedImage, 0, 0);

  // Dibujar rectángulos sobre cada sprite
  ctx.strokeStyle = '#4ade80';
  ctx.lineWidth = 1;
  let count = 0;
  for (let r = 0; r < p.rows && count < p.totalFrame; r++) {
    for (let c = 0; c < p.columns && count < p.totalFrame; c++) {
      const x = p.offsetX + c * (p.width + p.spacingX);
      const y = p.offsetY + r * (p.height + p.spacingY);
      ctx.strokeRect(x + 0.5, y + 0.5, p.width, p.height);
      count++;
    }
  }
  info.textContent = `Imagen: ${loadedImage.width}x${loadedImage.height} | Frames detectados: ${count}`;
}

processBtn.addEventListener('click', () => {
  if (!loadedImage) return;
  const p = getParams();
  cutSprites = [];
  spritesGrid.innerHTML = '';

  let count = 0;
  for (let r = 0; r < p.rows && count < p.totalFrame; r++) {
    for (let c = 0; c < p.columns && count < p.totalFrame; c++) {
      const sx = p.offsetX + c * (p.width + p.spacingX);
      const sy = p.offsetY + r * (p.height + p.spacingY);

      const tmpCanvas = document.createElement('canvas');
      tmpCanvas.width = p.width;
      tmpCanvas.height = p.height;
      const tctx = tmpCanvas.getContext('2d');
      tctx.drawImage(loadedImage, sx, sy, p.width, p.height, 0, 0, p.width, p.height);

      const dataUrl = tmpCanvas.toDataURL('image/png');
      const name = `sprite_${String(count).padStart(3,'0')}.png`;

      tmpCanvas.toBlob((blob) => {
        cutSprites[count] = { name, dataUrl, blob };
      }, 'image/png');

      // Thumbnail en UI
      const div = document.createElement('div');
      div.className = 'sprite-thumb';
      div.innerHTML = `<img src="${dataUrl}" alt="${name}"><span>${count}</span>`;
      spritesGrid.appendChild(div);

      count++;
    }
  }

  downloadBtn.disabled = false;
  info.textContent = `✅ ${count} sprites cortados correctamente.`;
});

downloadBtn.addEventListener('click', async () => {
  if (cutSprites.length === 0) return;

  // Esperar a que todos los blobs estén listos
  const ready = [];
  for (let i = 0; i < cutSprites.length; i++) {
    while (!cutSprites[i] || !cutSprites[i].blob) {
      await new Promise(r => setTimeout(r, 20));
    }
    ready.push(cutSprites[i]);
  }

  const zip = new JSZip();
  ready.forEach(s => zip.file(s.name, s.blob));
  const content = await zip.generateAsync({ type: 'blob' });

  const url = URL.createObjectURL(content);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'sprites.zip';
  a.click();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
